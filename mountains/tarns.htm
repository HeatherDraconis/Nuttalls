function setup()
	{
	general();
	if(m_touchdevice)
		timeout = 5000;
	else
		timeout = 300;
	createmenu();
	scrwidth = screenwidth();
	scrheight = screenheight();
	var tarnlist = 	document.getElementById('tarnlist');
	if(m_touchdevice == true)
		tarnlist.className = "tarnlisttouch";
	else
		tarnlist.className = "tarnlist";
	setuptarns();
	topcount();
	reset();
	}
	
function reset()
	{
	layoutmenu();
	layoutsortmenu();
	scrwidth = screenwidth();
	scrheight = screenheight();
	var tarnlist = document.getElementById("tarnlist");
	var mlistwrap = document.getElementById("mlistwrap");
	var back = document.getElementById("backdrop");
	back.style.minHeight=scrheight + 20 + "px";
	var noteb = document.getElementById("noteb");
	var rect = tarnlist.getBoundingClientRect();
	if(m_touchdevice || (scrwidth < 480))
		{
		// list extends full height
		back.style.width = scrwidth + "px";
		back.style.overflow = "visible";
		tarnlist.style.overflow = "visible";
		tarnlist.style.width = scrwidth + "px";
		mlistwrap.style.width = scrwidth + "px";
		tarnlist.style.height = "";
		tarnlist.style.overflow = "visible";
		if (scrwidth < 480)
			{
			note.style.width = scrwidth + "px";
			notea.style.width = (scrwidth - 126) + "px";
			}
		}
	else if(scrwidth > 1023)
		{
		// list with scrollbar
		back.style.width = "1024px";
		back.style.overflow = "hidden";
		tarnlist.style.overflow = "scroll";
		tarnlist.style.width = "480px";
		mlistwrap.style.width = "1024px";
		note.style.width = "480px";
		notea.style.width = "250px";
		if(window.innerHeight < (650 + rect.top))
			{
			tarnlist.style.height = (window.innerHeight - rect.top - 50) + "px";
			}
		else
			{
			tarnlist.style.height = "600px";
			}
		}
	else
		// not touchdevice or scrwidth between 480 and 1024
		{
		back.style.width = scrwidth + "px";
		back.style.overflow = "hidden";
		tarnlist.style.overflow = "scroll";
		tarnlist.style.width = "480px";
		mlistwrap.style.width = scrwidth + "px";
		note.style.width = "480px";
		notea.style.width = "250px";
		if(window.innerHeight < (650 + rect.top))
			{
			tarnlist.style.height = (window.innerHeight - rect.top - 50) + "px";
			}
		else
			{
			tarnlist.style.height = "600px";
			}
		}
	if(m_picvisible != "")
		{
		HidePic();
		ShowPic(glineid, gname,ggr)
		}
	}

function ShowPic(lineid, name,gr) {
	var scrwidth = screenwidth();
	var scrheight = screenheight();
	var pictop;
	glineid = lineid;
	gname = name;
	ggr = gr;
    var frame = document.getElementById("pictureframe");
    if (scrwidth < 850)
   		pictop = posTop();
   	else
   		pictop = posTop()+ 20;
	//clear hilite
	var ident;
	var elem;
	var count = tarns_list.length;
	for (var i = 0; i < count; i++)
		{
		ident = "top" + i;
		elem = document.getElementById(ident);
		elem.firstChild.style.color='#4C71D0';
		}
	elem = document.getElementById(lineid);
	elem.firstChild.style.color = '#FF0000';
	gridref = gr;  //save to use to get gridref
	document.getElementById("gr").innerHTML="Grid ref: " + gr;
    var picref = document.getElementById("pic");
    if ((scrwidth < 500) || (scrheight < 340))
    	{
			picref.src = "../images/tarns_small/" + name + ".jpg";
		}
	else
		{
			picref.src = "../images/tarns/" + name + ".jpg";
		}
	if(name =="")
		{
		
		}
    frame.style.visibility = "visible";
    header.style.visibility = "hidden";
    mainmenu.style.visibility = "hidden";
    var b = document.getElementById("navwrap");
    b.style.visibility = "hidden";
    var c = document.getElementById("note");
    c.style.visibility = "hidden";
    tarnlist.style.visibility = "hidden";
    m_picvisible = name;
    grvisible = gr;
	PositionPic(pictop);
}

function PositionPic(frametop)
{
	var scrwidth = screenwidth();
	var scrheight = screenheight();
   var picref = document.getElementById("pic");
   var frame = document.getElementById("pictureframe");
   var picwidth;
   var picheight;
   var picinfo = document.getElementById("picinfo");
	if (scrwidth >= 820)
		{
		if (scrheight >= 556)
			{
			//pic full size
			picwidth = 820;
			picheight = 556;
			}
		else
			{
			//fit to height and scale down width
			picheight = scrheight;
			picwidth = picheight*820/556;
			}
		}
	else
		{
		if (scrheight >= scrwidth*556/820)
			{
			//scale to width
			picwidth = scrwidth;
			picheight = picwidth*556/820;
			}
		else
			{
			//scale to height
			picheight = scrheight;
			picwidth = picheight*820/556;
			}
		}
	picref.style.height = "";
	picref.style.width = picwidth + "px";
   frame.style.top = frametop + "px";
	frame.style.left = (scrwidth - picwidth)/2 + "px";
  	picinfo.style.left = frame.style.left;
  	var closemsg = document.getElementById("closemsg");
  	var closebtn = document.getElementById("closebutton");
  	var capt = document.getElementById("caption");
  	if(m_picavailable)
  		{
  		capt.style.visibility = "visible";
  		closemsg.style.visibility = "visible";
  		closebtn.style.visibility = "hidden";
  		picinfo.style.top = "";
  		}
  	else
  		{
  		capt.style.visibility = "hidden";
  		closemsg.style.visibility = "hidden";
  		closebtn.style.visibility = "visible";
		picref.style.height = "0px";
  		picinfo.style.top = "10px";
  		}
}

function HidePic() {
    m_picvisible = "";
    grvisible = "";
    var frame = document.getElementById("pictureframe");
    var picref = document.getElementById("pic");
	picref.src = "";
    frame.style.visibility = "hidden";
    header.style.visibility = "visible";
    mainmenu.style.visibility = "visible";
    var b = document.getElementById("navwrap");
    b.style.visibility = "visible";
    var c = document.getElementById("note");
    c.style.visibility = "visible";
    var d = document.getElementById("closebutton");
    d.style.visibility = "hidden";
    tarnlist.style.visibility = "visible";
}

function posTop() 
	{
	return typeof window.pageYOffset != 'undefined' ?  window.pageYOffset : document.documentElement && document.documentElement.scrollTop ? document.documentElement.scrollTop : document.body.scrollTop ? document.body.scrollTop : 0;
	}
