function setup()
	{
	general();
	if(m_touchdevice)
		timeout = 5000;
	else
		timeout = 300;
	createmenu();
	scrwidth = screenwidth();
	scrheight = screenheight();
	var mountlist = 	document.getElementById('mountainlist');
	if(m_touchdevice == true)
		mountlist.className = "mountainlisttouch";
	else
		mountlist.className = "mountainlist";
	sorttops(units,field,"");
	topcount();
	reset();
	}
	
function reset()
	{
	layoutmenu();
	layoutsortmenu();
	scrwidth = screenwidth();
	scrheight = screenheight();
	var mountlist = document.getElementById("mountainlist");
	var mlistwrap = document.getElementById("mlistwrap");
	var back = document.getElementById("backdrop");
	back.style.minHeight=scrheight + 20 + "px";
	var noteb = document.getElementById("noteb");
	var rect = mountlist.getBoundingClientRect();
	if(m_touchdevice || (scrwidth < 480))
		{
		// list extends full height
		back.style.width = scrwidth + "px";
		back.style.overflow = "visible";
		mountlist.style.overflow = "visible";
		mountlist.style.width = scrwidth + "px";
		mlistwrap.style.width = scrwidth + "px";
		mountlist.style.height = "";
		mountlist.style.overflow = "visible";
		if (scrwidth < 480)
			{
			note.style.width = scrwidth + "px";
			notea.style.width = (scrwidth - 126) + "px";
			}
		}
	else if(scrwidth > 1023)
		{
		// list with scrollbar
		back.style.width = "1024px";
		back.style.overflow = "hidden";
		mountlist.style.overflow = "scroll";
		mountlist.style.width = "480px";
		mlistwrap.style.width = "1024px";
		note.style.width = "480px";
		notea.style.width = "250px";
		if(window.innerHeight < (650 + rect.top))
			{
			mountlist.style.height = (window.innerHeight - rect.top - 50) + "px";
			}
		else
			{
			mountlist.style.height = "600px";
			}
		}
	else
		// not touchdevice or scrwidth between 480 and 1024
		{
		back.style.width = scrwidth + "px";
		back.style.overflow = "hidden";
		mountlist.style.overflow = "scroll";
		mountlist.style.width = "480px";
		mlistwrap.style.width = scrwidth + "px";
		note.style.width = "480px";
		notea.style.width = "250px";
		if(window.innerHeight < (650 + rect.top))
			{
			mountlist.style.height = (window.innerHeight - rect.top - 50) + "px";
			}
		else
			{
			mountlist.style.height = "600px";
			}
		}
	if(m_picvisible != "")
		{
		HidePic();
		ShowPic(glineid, gname,ggr)
		}
	}

function ShowPic(lineid, name,gr) {
	var scrwidth = screenwidth();
	var scrheight = screenheight();
	var pictop;
	glineid = lineid;
	gname = name;
	ggr = gr;
    var frame = document.getElementById("pictureframe");
    if (scrwidth < 850)
   		pictop = posTop();
   	else
   		pictop = posTop()+ 20;
	//clear hilite
	var ident;
	var elem;
	var count = mountains_list.length;
	for (var i = 0; i < count; i++)
		{
		ident = "top" + i;
		elem = document.getElementById(ident);
		elem.firstChild.style.color='#4C71D0';
		}
	elem = document.getElementById(lineid);
	elem.firstChild.style.color = '#FF0000';
	gridref = gr;  //save to use to get gridref
	if(name.substr(0,1) != "#")
		document.getElementById("caption").innerHTML=name;
	else
		{
		name = "Sorry";
		document.getElementById("caption").innerHTML="";
		}
	document.getElementById("gr").innerHTML="Grid ref: " + gr;
    var picref = document.getElementById("pic");
    if ((scrwidth < 500) || (scrheight < 340))
    	{
			picref.src = "../images/wales_small/" + name + ".jpg";
		}
	else
		{
			picref.src = "../images/wales/" + name + ".jpg";
		}
    frame.style.visibility = "visible";
    header.style.visibility = "hidden";
    mainmenu.style.visibility = "hidden";
    var b = document.getElementById("navwrap");
    b.style.visibility = "hidden";
    var c = document.getElementById("note");
    c.style.visibility = "hidden";
    var sm = document.getElementById("sortmenu");
    sm.style.visibility = "hidden";
    mountainlist.style.visibility = "hidden";
    m_picvisible = name;
    grvisible = gr;
	PositionPic(pictop);
}

function PositionPic(frametop)
{
	var scrwidth = screenwidth();
	var scrheight = screenheight();
   var picref = document.getElementById("pic");
   var frame = document.getElementById("pictureframe");
   var picwidth;
   var picheight;
   var picinfo = document.getElementById("picinfo");
	if (scrwidth >= 820)
		{
		if (scrheight >= 556)
			{
			//pic full size
			picwidth = 820;
			picheight = 556;
			}
		else
			{
			//fit to height and scale down width
			picheight = scrheight;
			picwidth = picheight*820/556;
			}
		}
	else
		{
		if (scrheight >= scrwidth*556/820)
			{
			//scale to width
			picwidth = scrwidth;
			picheight = picwidth*556/820;
			}
		else
			{
			//scale to height
			picheight = scrheight;
			picwidth = picheight*820/556;
			}
		}
	picref.style.height = "";
	picref.style.width = picwidth + "px";
   frame.style.top = frametop + "px";
	frame.style.left = (scrwidth - picwidth)/2 + "px";
  	picinfo.style.left = frame.style.left;
  }

}

function sorttops(units,order,user)
{
	//sorts the original list
	//base is the index from which I calculate the position of ft and m
	var alist = document.getElementById("mountainlist");
	var base = 27;
	var pos = base;
	//only change units if given in call
	if(user != "" & order == "Name")
		dirName = !dirName;
	else if(user != "" & order == "Height")
		dirHeight = !dirHeight;
	
	if(units == "" & dirUnits == "ft")
		pos = base;
	else if(units == "" & dirUnits == "m")
		pos = base + 9;
	else if(units == "m")
		{
		dirUnits = "m";
		pos = base +9;
		}
	else if(units == "ft")
		{
		dirUnits = "ft";
		pos = base;
		}
	if(order == "Name")
		{
			if(dirName)
				{
				// have to sort first in case previous sort was by height
				mountains_list.sort();
				mountains_list.reverse();
				}
			else
				mountains_list.sort();
		}
	else if(order == "Height")
		//sort by height
		// position of height value depends on whether it's feet or metres
		{
			mountains_list.sort(function(sa,sb)
			{
				var ha = sa.substr(pos,4);
				var hb = sb.substr(pos,4);
				if(dirHeight)
					return ha - hb;
				else
					return hb - ha;
			})
		}
	//setup the display
   var innerHTML = "";
   var thisline;
	for (var i = 0; i < mountains_list.length; i++)
		{
		entry = mountains_list[i];
		tab1 = entry.indexOf("\t",1);
		var caption = entry.substr(base +26,entry.length);
		// fix the quote mark in captions
		caption = caption.replace(/\'s/,"\\'s");
		caption = caption.replace(/\'S/,"\\'S");
		var gridref = entry.substr(base+17,8);
 		var display = entry.substr(0,base-1);
 		if(dirUnits == "ft")
 			height = entry.substr(base, 6);
 		else
 			height = entry.substr(base + 9,5);
 		if(scrwidth > 400)
 			{
 			display = display + "  " + height + "  " + gridref; 			
 			}
		else
			{
 			display = display + "  " + height;
			}
 		thisline = "<li id=\"top" + i + "\" onclick=";
 		thisline = thisline + "\"ShowPic('top" + i + "', '" + caption + "','" + gridref + "');return false;\"";
 		thisline = thisline + "><a href=\"#\">";
 		thisline = thisline + display + "</a></li>";
		innerHTML = innerHTML + thisline;
		}
	alist.innerHTML = innerHTML;
	alist.style.overflow = "auto";
	return(false);
}

function topcount()
{
	var headcount = document.getElementById("header");
	var count = mountains_list.length;
	headcount.innerHTML = headcount.innerHTML.replace("***",count);	
}
